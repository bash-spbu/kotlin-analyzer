[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "Apache-2.0"
authors = ["Alexander Bashkirov"]
publish = false
rust-version = "1.90"

[workspace.dependencies]
# Internal crates — which one may depend on which is checked by `cargo xtask check`.
intern = { path = "crates/intern" }
vfs = { path = "crates/vfs" }
syntax = { path = "crates/syntax" }
project-model = { path = "crates/project-model" }
base-db = { path = "crates/base-db" }
hir-def = { path = "crates/hir-def" }
hir-ty = { path = "crates/hir-ty" }
hir = { path = "crates/hir" }
ide = { path = "crates/ide" }
classfile = { path = "crates/classfile" }
jdwp = { path = "crates/jdwp" }
debugger = { path = "crates/debugger" }

# External
salsa = "0.28"
tree-sitter = "0.26"
tree-sitter-kotlin = { package = "brokk-tree-sitter-kotlin", version = "0.4" }
tree-sitter-java = "0.23"
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
rustc-hash = "2"
boxcar = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
expect-test = "1"
memory-stats = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
sha2 = "0.10"
tracing = "0.1"

[workspace.lints.rust]
# Allowed in one file only, the profiling allocator (`cargo xtask check`).
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
