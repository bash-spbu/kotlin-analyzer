[package]
name = "kotlin-analyzer-zed"
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# Built by Zed for WebAssembly; not a member of the server's workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.5.0"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
