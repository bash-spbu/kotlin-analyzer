// kotlin-analyzer: exports the build's model for the language server.
//
//   ./gradlew --no-configuration-cache -Dorg.gradle.isolated-projects=false \
//       --init-script kotlin-analyzer.init.gradle kotlinAnalyzerModel
//
// writes .kotlin-analyzer/project.json in the root project: every module, its
// source sets (generated directories included), the source sets of other
// modules each one sees, and the exact libraries the build resolves for it
// (with sources JARs found next to them in the Gradle cache), plus the JDK.
// `-PkotlinAnalyzerOutput=<file>` writes elsewhere.
//
// Three kinds of module are read:
// - JVM (the `java` plugin's source sets: Java, Kotlin/JVM, Spring, …);
// - Kotlin Multiplatform (`kotlin.sourceSets`, their `dependsOn`, and per
//   source set the classpath of a JVM or Android compilation it is part of;
//   a source set compiled only for Native or JS gets the standard library);
// - Android (AGP: `android.sourceSets`, one debug variant's classpaths, the
//   SDK's android.jar).
//
// Each project resolves its own classpaths in its own task (Gradle 9 forbids
// resolving another project's configurations); the root task merges them.
// The tasks read the project at execution time, so the export runs without
// the configuration cache and isolated projects.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.attributes.Attribute

def partFile = { project -> new File(project.layout.buildDirectory.get().asFile, "kotlin-analyzer/module.json") }

// A sources JAR for a library: next to its JAR in the Gradle cache
// (…/<version>/<hash>/name.jar) or a Maven repository (…/<version>/name.jar),
// else — for a JAR unpacked from an Android archive — under the module's
// coordinates in the Gradle cache. Never downloaded.
def sourcesJarOf = { project, ModuleComponentIdentifier component, File jar ->
    def sourcesName = jar.name.replaceAll(/\.jar$/, "-sources.jar")
    def sibling = new File(jar.parentFile, sourcesName)
    if (sibling.isFile()) return sibling.absolutePath
    def versionDirectory = jar.parentFile?.parentFile
    def nearby = versionDirectory?.listFiles()?.findResult { hashDirectory ->
        def candidate = new File(hashDirectory, sourcesName)
        candidate.isFile() ? candidate : null
    }
    if (nearby != null) return nearby.absolutePath
    def cached = new File(project.gradle.gradleUserHomeDir,
        "caches/modules-2/files-2.1/${component.group}/${component.module}/${component.version}")
    def byCoordinates = cached.listFiles()?.findResult { hashDirectory ->
        def candidate = new File(hashDirectory, "${component.module}-${component.version}-sources.jar")
        candidate.isFile() ? candidate : null
    }
    return byCoordinates?.absolutePath
}

def artifactType = Attribute.of("artifactType", String)

def resolveClasspathInto = { Map found, project, String configurationName, boolean android ->
    def libraries = found.libraries
    def projects = found.projects
    def configuration = project.configurations.findByName(configurationName)
    if (configuration == null || !configuration.canBeResolved) return
    def views = [configuration.incoming.artifactView { lenient(true) }]
    if (android) {
        views << configuration.incoming.artifactView {
            lenient(true)
            attributes { it.attribute(artifactType, "android-classes-jar") }
        }
    }
    def seenJars = new HashSet<String>()
    views.each { view ->
        def failures = view.artifacts.failures
        if (!failures.isEmpty()) {
            project.logger.warn("kotlin-analyzer: ${project.path} ${configurationName}: ${failures.size()} artifacts not resolved (${failures.first().message?.take(160)})")
        }
        // A library that couldn't be fetched leaves the classpath partial;
        // a variant mismatch (a JVM module seen through the Android view)
        // doesn't: the plain view has it.
        def missing = failures.any { failure ->
            def text = failure.toString() + " " + (failure.cause?.toString() ?: "")
            text.contains("Could not resolve") || text.contains("Could not download") || text.contains("Could not find")
        }
        if (missing) found.complete = false
        view.artifacts.each { artifact ->
            def component = artifact.id.componentIdentifier
            if (component instanceof ProjectComponentIdentifier) {
                def fixtures = artifact.variant.capabilities.any { it.name.endsWith("-test-fixtures") }
                def dependency = [path: component.projectPath, fixtures: fixtures]
                if (!projects.contains(dependency)) projects << dependency
            } else if (component instanceof ModuleComponentIdentifier
                && artifact.file.name.endsWith(".jar")
                && seenJars.add(artifact.file.absolutePath)) {
                libraries << [
                    coordinates: "${component.group}:${component.module}:${component.version}",
                    jar: artifact.file.absolutePath,
                    sourcesJar: sourcesJarOf(project, component, artifact.file),
                ]
            }
        }
    }
}

// The JARs and the other projects a configuration resolves to. Android
// archives are read through AGP's `android-classes-jar` artifacts. A
// configuration that can't be resolved here (a toolchain that isn't
// installed, a repository that's down) gives what resolved before it failed,
// with a warning: one source set's classpath doesn't stop the export.
def resolveClasspath = { project, String configurationName, boolean android ->
    def found = [libraries: [], projects: [], complete: true]
    try {
        resolveClasspathInto(found, project, configurationName, android)
    } catch (Exception failure) {
        found.complete = false
        def cause = failure
        while (cause.cause != null && cause.cause != cause) cause = cause.cause
        project.logger.warn("kotlin-analyzer: ${project.path} ${configurationName} not resolved: ${cause.message?.take(200)}")
    }
    return found
}

// The SDK's android.jar (and the optional platform JARs) an Android module
// compiles against.
def androidBootClasspath = { project ->
    def jars = []
    try {
        project.extensions.getByName("androidComponents").sdkComponents.bootClasspath.get().each {
            def jar = it.asFile
            if (jar.isFile()) jars << [coordinates: "android:android:sdk", jar: jar.absolutePath, sourcesJar: null]
        }
    } catch (ignored) {
    }
    return jars
}

def addDependency = { List dependencies, String module, String sourceSet ->
    def dependency = [module: module, sourceSet: sourceSet]
    if (!dependencies.contains(dependency)) dependencies << dependency
}

// --- JVM: the `java` plugin's source sets -----------------------------------

// --- Compiler options ----------------------------------------------------------

// What a Kotlin compile task tells the compiler that changes what it reports:
// warnings as errors or suppressed (all, or by name), opt-ins, the API and
// language versions and the JDK release. A field it can't read is left out.
def compilerOptionsOf = { project, task ->
    if (task == null) return null
    def options = [warningsAsErrors: false, suppressWarnings: false, warningLevels: [:], optIn: []]
    def free = []
    try {
        def compilerOptions = task.compilerOptions
        options.warningsAsErrors = compilerOptions.allWarningsAsErrors.getOrElse(false)
        options.suppressWarnings = compilerOptions.suppressWarnings.getOrElse(false)
        options.optIn = (compilerOptions.optIn.getOrElse([]) as List).collect { it.toString() }
        def apiVersion = compilerOptions.apiVersion.getOrNull()
        if (apiVersion != null) options.apiVersion = apiVersion.version
        def languageVersion = compilerOptions.languageVersion.getOrNull()
        if (languageVersion != null) options.languageVersion = languageVersion.version
        free = (compilerOptions.freeCompilerArgs.getOrElse([]) as List).collect { it.toString() }
    } catch (ignored) {
    }
    try {
        def javaVersion = task.kotlinJavaToolchain.javaVersion.getOrNull()
        if (javaVersion != null) options.jdkRelease = Integer.parseInt(javaVersion.majorVersion)
    } catch (ignored) {
    }
    free.eachWithIndex { argument, index ->
        if (argument == "-Werror") options.warningsAsErrors = true
        else if (argument == "-nowarn") options.suppressWarnings = true
        else if (argument.startsWith("-Xsuppress-warning=")) options.warningLevels[argument - "-Xsuppress-warning="] = "disabled"
        else if (argument.startsWith("-Xwarning-level=")) {
            def parts = (argument - "-Xwarning-level=").split(":")
            if (parts.length == 2) options.warningLevels[parts[0]] = parts[1]
        }
        else if (argument.startsWith("-opt-in=")) options.optIn << (argument - "-opt-in=")
        else if (argument.startsWith("-Xopt-in=")) options.optIn << (argument - "-Xopt-in=")
        else if (argument.startsWith("-Xjdk-release=")) {
            def release = (argument - "-Xjdk-release=") - "1."
            if (release.isInteger()) options.jdkRelease = release.toInteger()
        }
        else if (argument == "-api-version" && index + 1 < free.size()) options.apiVersion = free[index + 1]
        else if (argument == "-language-version" && index + 1 < free.size()) options.languageVersion = free[index + 1]
    }
    // Unset, the language version is the compiler's own, and the API
    // version the language version.
    if (options.languageVersion == null) {
        try {
            def version = project.extensions.getByName("kotlin").coreLibrariesVersion.toString()
            def numbers = version.split(/[.\-]/)
            if (numbers.length >= 2) options.languageVersion = "${numbers[0]}.${numbers[1]}"
        } catch (ignored) {
        }
    }
    if (options.apiVersion == null) options.apiVersion = options.languageVersion
    return options
}

// The options of every compilation a source set is part of, as one: a
// warning is an error if any compilation makes it one; suppressed, opted
// into or of one level only if all agree; a version only if all have it.
def mergeCompilerOptions = { List all ->
    def known = all.findAll { it != null }
    if (known.isEmpty()) return null
    def merged = [
        warningsAsErrors: known.any { it.warningsAsErrors },
        suppressWarnings: known.every { it.suppressWarnings },
        warningLevels: known[0].warningLevels.findAll { name, level ->
            known.every { it.warningLevels[name] == level }
        },
        optIn: known[0].optIn.findAll { name -> known.every { it.optIn.contains(name) } },
    ]
    def same = { String field ->
        def values = known.collect { it[field] }.unique()
        values.size() == 1 && values[0] != null ? values[0] : null
    }
    if (same("apiVersion") != null) merged.apiVersion = same("apiVersion")
    if (same("languageVersion") != null) merged.languageVersion = same("languageVersion")
    if (same("jdkRelease") != null) merged.jdkRelease = same("jdkRelease")
    return merged
}

// What a Kotlin source set opts into through `languageSettings.optIn(…)`,
// which the compile task's options don't show.
def languageSettingsOptIns = { kotlinSourceSet ->
    try {
        return (kotlinSourceSet?.languageSettings?.optInAnnotationsInUse ?: []).collect { it.toString() }
    } catch (ignored) {
        return []
    }
}

def withOptIns = { Map compiler, List optIns ->
    if (compiler == null || optIns.isEmpty()) return compiler
    return compiler + [optIn: (compiler.optIn + optIns).unique()]
}

def kotlinCompileTask = { project, String name ->
    try {
        return project.tasks.findByName(name)
    } catch (ignored) {
        return null
    }
}

def javaSourceSetExport = { project, sourceSet ->
    def directories = new LinkedHashSet<String>()
    sourceSet.java.srcDirs.each { directories << it.absolutePath }
    def kotlinSources = sourceSet.extensions.findByName("kotlin")
    if (kotlinSources != null) {
        kotlinSources.srcDirs.each { directories << it.absolutePath }
    }
    def resolved = resolveClasspath(project, sourceSet.compileClasspathConfigurationName, false)
    def moduleDependencies = []
    resolved.projects.each { dependency ->
        // A JVM module's view of a Kotlin Multiplatform one is its JVM side.
        def targets = dependency.fixtures ? ["testFixtures"] : ["main", "commonMain", "jvmMain"]
        targets.each { addDependency(moduleDependencies, dependency.path, it) }
    }
    def kotlinSourceSet = null
    try {
        kotlinSourceSet = project.extensions.findByName("kotlin")?.sourceSets?.findByName(sourceSet.name)
    } catch (ignored) {
    }
    def compiler = withOptIns(
        compilerOptionsOf(project, kotlinCompileTask(project, sourceSet.getCompileTaskName("kotlin"))),
        languageSettingsOptIns(kotlinSourceSet))
    return [
        name: sourceSet.name,
        sourceDirectories: directories.toList(),
        moduleDependencies: moduleDependencies,
        libraries: resolved.libraries,
        classpath: resolved.complete ? "complete" : "partial",
    ] + (compiler != null ? [compilerOptions: compiler] : [:])
}

// --- Kotlin Multiplatform ----------------------------------------------------

def isMultiplatform = { project ->
    def kotlin = project.extensions.findByName("kotlin")
    kotlin != null && kotlin.class.name.contains("KotlinMultiplatformExtension")
}

def platformOf = { compilation -> compilation.target.platformType.name() }
def isJvmLike = { compilation -> platformOf(compilation) in ["jvm", "androidJvm"] }
def isTestCompilation = { compilation -> compilation.name.toLowerCase().contains("test") }

// The other projects a source set declares (api / implementation /
// compileOnly), by path.
def declaredProjects = { project, sourceSet ->
    def paths = []
    [sourceSet.apiConfigurationName, sourceSet.implementationConfigurationName,
     sourceSet.compileOnlyConfigurationName].each { name ->
        project.configurations.findByName(name)?.dependencies?.withType(ProjectDependency)?.each { dependency ->
            def path = dependency.hasProperty("path") ? dependency.path : dependency.dependencyProject.path
            if (!paths.contains(path)) paths << path
        }
    }
    return paths
}

// The source sets of another project a source set sees: the same
// platform's main code (`jvmMain` for `jvmMain` and `jvmTest`), its common
// code, and a JVM or Android project's `main`.
def projectSourceSets = { String sourceSetName ->
    def platformMain = sourceSetName.endsWith("Test") ? sourceSetName[0..-5] + "Main" : sourceSetName
    [platformMain, "commonMain", "main"].unique()
}

def multiplatformExport = { project ->
    def kotlin = project.extensions.getByName("kotlin")
    // Which compilations (not the metadata ones) each source set is part of.
    def compilationsOf = [:].withDefault { [] }
    kotlin.targets.each { target ->
        if (target.platformType.name() == "common") return
        target.compilations.each { compilation ->
            compilation.allKotlinSourceSets.each { compilationsOf[it.name] << compilation }
        }
    }
    def classpaths = [:]
    def classpathOf = { compilation ->
        classpaths.computeIfAbsent(compilation.compileDependencyConfigurationName) {
            resolveClasspath(project, it, platformOf(compilation) == "androidJvm")
        }
    }
    // The standard library, for source sets no JVM compilation builds.
    def standardLibrary = []
    def anyJvm = compilationsOf.values().flatten().find { isJvmLike(it) && !isTestCompilation(it) }
    if (anyJvm != null) {
        standardLibrary = classpathOf(anyJvm).libraries.findAll {
            it.coordinates.startsWith("org.jetbrains.kotlin:kotlin-stdlib")
        }
    }
    return kotlin.sourceSets.collect { sourceSet ->
        def compilations = compilationsOf[sourceSet.name]
        def isTest = compilations.isEmpty()
            ? sourceSet.name.endsWith("Test")
            : compilations.every { isTestCompilation(it) }
        def moduleDependencies = []
        // What it's built on, and for a test, the main code it tests.
        def parents = new LinkedHashSet()
        def frontier = [sourceSet]
        while (!frontier.isEmpty()) {
            def next = []
            frontier.each { current -> current.dependsOn.each { if (parents.add(it)) next << it } }
            frontier = next
        }
        parents.each { addDependency(moduleDependencies, project.path, it.name) }
        if (isTest) {
            // The main code every compilation it's part of tests: for
            // commonTest, commonMain — not jvmMain because jvmTest tests it.
            def tested = null
            compilations.each { compilation ->
                def main = compilation.target.compilations.findByName("main")?.allKotlinSourceSets?.collect { it.name } ?: []
                tested = tested == null ? main : tested.intersect(main)
            }
            (tested ?: []).each { addDependency(moduleDependencies, project.path, it) }
        }
        declaredProjects(project, sourceSet).each { path ->
            projectSourceSets(sourceSet.name).each { addDependency(moduleDependencies, path, it) }
        }
        // Built for the JVM or Android: that compilation's classpath — the
        // source set's own one first, the JVM's before Android's (common
        // code doesn't see Android); else only the standard library.
        def jvmCompilations = compilations.findAll { isJvmLike(it) }
        def mainOrTest = { it.name in ["main", "debug", "test", "debugUnitTest", "unitTest", "hostTest"] }
        def preferred = jvmCompilations.find { it.defaultSourceSet.name == sourceSet.name } ?:
            jvmCompilations.find { platformOf(it) == "jvm" && mainOrTest(it) } ?:
            jvmCompilations.find { mainOrTest(it) } ?:
            jvmCompilations.find()
        def libraries = standardLibrary
        def complete = true
        if (preferred != null) {
            def resolved = classpathOf(preferred)
            libraries = resolved.libraries
            complete = resolved.complete
            if (platformOf(preferred) == "androidJvm") libraries = libraries + androidBootClasspath(project)
            resolved.projects.each { dependency ->
                projectSourceSets(sourceSet.name).each { addDependency(moduleDependencies, dependency.path, it) }
            }
        }
        def compiler = withOptIns(mergeCompilerOptions(compilations.collect { compilation ->
            def task = null
            try {
                task = compilation.compileTaskProvider.get()
            } catch (ignored) {
            }
            compilerOptionsOf(project, task)
        }), languageSettingsOptIns(sourceSet))
        return [
            name: sourceSet.name,
            kind: isTest ? "test" : "main",
            // Only code built for the JVM or Android sees the JDK.
            platform: preferred != null ? "jvm" : "other",
            sourceDirectories: sourceSet.kotlin.srcDirs.collect { it.absolutePath },
            moduleDependencies: moduleDependencies,
            libraries: libraries,
            classpath: complete ? "complete" : "partial",
        ] + (compiler != null ? [compilerOptions: compiler] : [:])
    }
}

// --- Android (AGP) -------------------------------------------------------------

def isAndroid = { project -> project.extensions.findByName("androidComponents") != null }

def androidExport = { project ->
    def android = project.extensions.getByName("android")
    // One debug variant stands for the module: `debug`, else the first
    // `<flavours>Debug`, else the first variant.
    def variants = project.configurations.names
        .findAll { it.endsWith("CompileClasspath") }
        .collect { it - "CompileClasspath" }
        .findAll { !(it =~ /(UnitTest|AndroidTest|TestFixtures|ScreenshotTest)$/) && it != "" }
        .sort()
    def variant = variants.find { it == "debug" } ?: variants.find { it.endsWith("Debug") } ?: variants.find()
    def bootClasspath = androidBootClasspath(project)
    def variantWords = variant == null ? [] : variant.split(/(?=[A-Z])/).collect { it.uncapitalize() }
    def inVariant = { String name -> name == "main" || name == variant || variantWords.contains(name) }
    def isFixtures = { String name -> name.startsWith("testFixtures") }
    def isUnitTest = { String name -> name.startsWith("test") && !isFixtures(name) }
    def isDeviceTest = { String name -> name.startsWith("androidTest") }
    def mainClasspath = variant == null ? [libraries: [], projects: [], complete: true] : resolveClasspath(project, "${variant}CompileClasspath", true)
    def unitTestClasspath = variant == null ? mainClasspath : resolveClasspath(project, "${variant}UnitTestCompileClasspath", true)
    def deviceTestClasspath = variant == null ? mainClasspath : resolveClasspath(project, "${variant}AndroidTestCompileClasspath", true)
    def variantSets = android.sourceSets.names.findAll {
        !isUnitTest(it) && !isDeviceTest(it) && !isFixtures(it) && inVariant(it)
    }
    return android.sourceSets.collect { sourceSet ->
        def name = sourceSet.name
        def isTest = isUnitTest(name) || isDeviceTest(name)
        def kind = isTest ? "test" : (isFixtures(name) ? "testFixtures" : "main")
        def directories = new LinkedHashSet<String>()
        sourceSet.java.srcDirs.each { directories << it.absolutePath }
        try {
            sourceSet.kotlin.srcDirs.each { directories << it.absolutePath }
        } catch (ignored) {
        }
        def classpath = isUnitTest(name) ? unitTestClasspath : (isDeviceTest(name) ? deviceTestClasspath : mainClasspath)
        def moduleDependencies = []
        // The variant's main code sees itself as one; tests see it; another
        // flavour or build type sees main only.
        // Test fixtures see it too, like tests.
        def sees = isTest || isFixtures(name) || inVariant(name) ? variantSets : ["main"]
        sees.findAll { it != name }.each { addDependency(moduleDependencies, project.path, it) }
        classpath.projects.each { dependency ->
            addDependency(moduleDependencies, dependency.path, dependency.fixtures ? "testFixtures" : "main")
            addDependency(moduleDependencies, dependency.path, "commonMain")
            variantSets.each { addDependency(moduleDependencies, dependency.path, it) }
        }
        // The variant's compile task: `compileDebugKotlin`,
        // `compileDebugUnitTestKotlin`, `compileDebugAndroidTestKotlin`.
        def compiled = variant == null ? null : variant.capitalize() + (isUnitTest(name) ? "UnitTest" : (isDeviceTest(name) ? "AndroidTest" : ""))
        def compiler = compiled == null ? null : compilerOptionsOf(project, kotlinCompileTask(project, "compile${compiled}Kotlin"))
        return [
            name: name,
            kind: kind,
            sourceDirectories: directories.toList(),
            moduleDependencies: moduleDependencies,
            libraries: classpath.libraries + bootClasspath,
            classpath: classpath.complete == false ? "partial" : "complete",
        ] + (compiler != null ? [compilerOptions: compiler] : [:])
    }
}

allprojects { project ->
    project.tasks.register("kotlinAnalyzerModule") {
        group = "kotlin-analyzer"
        description = "Writes this module's part of the kotlin-analyzer model."
        doLast {
            def exported
            if (isMultiplatform(project)) {
                exported = multiplatformExport(project)
            } else if (isAndroid(project)) {
                exported = androidExport(project)
            } else {
                def sourceSets = project.extensions.findByName("sourceSets")
                exported = sourceSets == null ? [] : sourceSets.collect { javaSourceSetExport(project, it) }
            }
            def part = partFile(project)
            part.parentFile.mkdirs()
            part.text = JsonOutput.toJson([
                path: project.path,
                directory: project.projectDir.absolutePath,
                sourceSets: exported,
            ])
        }
    }
    if (project == project.rootProject) {
        project.tasks.register("kotlinAnalyzerModel") {
            group = "kotlin-analyzer"
            description = "Writes .kotlin-analyzer/project.json for the kotlin-analyzer language server."
            dependsOn(project.rootProject.allprojects.collect { it.tasks.named("kotlinAnalyzerModule") })
            doLast {
                def slurper = new JsonSlurper()
                def modules = project.rootProject.allprojects.collect { member ->
                    def part = partFile(member)
                    part.isFile() ? slurper.parse(part) : null
                }.findAll { it != null }
                def javaHome = System.getProperty("java.home")
                def release = null
                try {
                    def javaExtension = project.extensions.findByName("java")
                    def version = javaExtension?.toolchain?.languageVersion?.getOrNull()
                    if (version != null) release = version.asInt()
                } catch (ignored) {
                }
                def model = [version: 1, jdk: [home: javaHome, release: release], modules: modules]
                def outputPath = project.findProperty("kotlinAnalyzerOutput")
                def output = outputPath != null
                    ? new File(outputPath.toString())
                    : new File(project.rootDir, ".kotlin-analyzer/project.json")
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson(model))
                println("kotlin-analyzer: wrote ${output} (${modules.size()} modules)")
            }
        }
    }
}
