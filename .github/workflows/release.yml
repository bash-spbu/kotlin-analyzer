# Builds the server for every supported platform and, for a `v*` tag,
# publishes a GitHub release with:
#
# - `kotlin-analyzer-<target>.gz` — the gzipped binary — and
#   `kotlin-analyzer-<target>.gz.sha256`, which the VS Code extension, the
#   Neovim plugin and `editors/install-server.sh` download and verify;
# - `kotlin-analyzer-<version>.vsix` — the VS Code extension.
#
# Run by hand (workflow_dispatch), it builds everything and keeps it as
# workflow artifacts, without a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: none
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The editors' versions agree with the server's
        run: cargo xtask versions
      - name: The tag is the server's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kotlin-analyzer") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME, server version $version"; exit 1; }

  server:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package kotlin-analyzer --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/kotlin-analyzer --version
      - name: Package
        shell: bash
        run: |
          asset=kotlin-analyzer-${{ matrix.target }}.gz
          mkdir -p dist
          gzip -9 -c target/${{ matrix.target }}/release/kotlin-analyzer > dist/$asset
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum $asset > $asset.sha256
          else shasum -a 256 $asset > $asset.sha256; fi
          cat $asset.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*

  vscode:
    needs: versions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: editors/vscode/*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [server, vscode]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
